[project]
name = "brain-tumor-uq"
version = "0.1.0"
description = "Uncertainty and interpretability in brain tumor MRI classification"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external", "thesis", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"